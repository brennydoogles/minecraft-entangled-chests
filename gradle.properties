org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft — 26.x is deobfuscated, so no mappings are needed.
# Compiled against 26.1.2; the declared range also covers 26.2 (see mod metadata).
minecraft_version=26.1.2
enabled_platforms=fabric,neoforge

# Mod
mod_version=2.0.0
maven_group=com.brendondugan.entangledchests
archives_base_name=entangledchests

# Dependencies (26.1 line)
architectury_version=20.0.9
fabric_loader_version=0.19.3
fabric_api_version=0.155.2+26.1.2
neoforge_version=26.1.2.87

# loom-no-remap: our mod dependencies (Architectury, Fabric API) were built with a
# different Loom; don't fail the build validating their Loom version.
loom.ignoreDependencyLoomVersionValidation=true
