apply plugin: 'com.gradleup.shadow'

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

dependencies {
	implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	implementation "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

	common(project(path: ':common')) { transitive = false }
	shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', rootProject.minecraft_version
	inputs.property 'fabric_loader_version', rootProject.fabric_loader_version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version,
				'minecraft_version': rootProject.minecraft_version,
				'fabric_loader_version': rootProject.fabric_loader_version
	}
}

// No-remap era: the raw jar is an intermediate; the shadowJar (with common bundled
// in) is the final, distributable jar.
jar {
	archiveClassifier = 'raw'
}

shadowJar {
	exclude 'architectury.common.json'

	dependsOn jar
	mainSpec.sourcePaths.clear()
	from(zipTree(jar.archiveFile))
	configurations = [project.configurations.shadowCommon]
	archiveClassifier = null
	zip64 = true
}

assemble.dependsOn shadowJar
