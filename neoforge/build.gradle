apply plugin: 'com.gradleup.shadow'

architectury {
	platformSetupLoomIde()
	neoForge()
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common
}

dependencies {
	neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
	implementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

	common(project(path: ':common')) { transitive = false }
	shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', rootProject.minecraft_version
	inputs.property 'neoforge_version', rootProject.neoforge_version

	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': project.version,
				'minecraft_version': rootProject.minecraft_version,
				'neoforge_version': rootProject.neoforge_version
	}
}

// No-remap era: the raw jar is an intermediate; the shadowJar (with common bundled
// in) is the final, distributable jar.
jar {
	archiveClassifier = 'raw'
}

shadowJar {
	exclude 'fabric.mod.json'
	exclude 'architectury.common.json'

	dependsOn jar
	mainSpec.sourcePaths.clear()
	from(zipTree(jar.archiveFile))
	configurations = [project.configurations.shadowCommon]
	archiveClassifier = null
	zip64 = true
}

assemble.dependsOn shadowJar
