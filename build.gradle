plugins {
	id 'architectury-plugin' version '3.5.169'
	id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
	id 'com.gradleup.shadow' version '9.6.1' apply false
}

architectury {
	minecraft = rootProject.minecraft_version
}

allprojects {
	apply plugin: 'java'
	apply plugin: 'architectury-plugin'

	version = rootProject.mod_version
	group = rootProject.maven_group

	repositories {
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.neoforged.net/releases/' }
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.encoding = 'UTF-8'
		it.options.release = 25
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
}

subprojects {
	apply plugin: 'dev.architectury.loom-no-remap'

	base {
		archivesName = rootProject.archives_base_name
	}

	dependencies {
		// Deobfuscated Minecraft — no `mappings` line, the jar is already named.
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	}

	// For each loader platform, copy its final (shadowed) jar up to the root
	// build/libs directory as entangledchests-<version>-<platform>.jar. In the
	// deobfuscated / no-remap era the distributable jar is `shadowJar`, not
	// `remapJar` (there is no remapping step).
	if (project.name in rootProject.enabled_platforms.split(',')) {
		def platform = project.name
		def collectJar = tasks.register('collectJar', Copy) {
			group = 'build'
			description = "Copies the ${platform} jar into the root build/libs directory."
			from tasks.named('shadowJar')
			into rootProject.layout.buildDirectory.dir('libs')
			rename { "${rootProject.archives_base_name}-${rootProject.mod_version}-${platform}.jar" }
		}

		tasks.named('build').configure {
			finalizedBy collectJar
		}
	}
}

// Convenience aggregate: build every platform and gather the jars in build/libs.
tasks.register('collectJars') {
	group = 'build'
	description = 'Builds all platforms and copies their final jars into build/libs.'
	dependsOn rootProject.enabled_platforms.split(',').collect { ":${it}:collectJar" }
}

// The root project is only an aggregator — it should not emit its own (empty) jar.
tasks.named('jar') { enabled = false }
